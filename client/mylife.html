<!-- Hero -->

<!-- 抖音数据卡片 -->
<section class="section">
  <div class="douyin-grid">
    <div class="douyin-card card">
      <span class="card-emoji">🎬</span>
      <h2>日常的枸杞</h2>
      <p>分享生活中的小灵感，用短视频记录每一天的有趣瞬间。</p>
      <div class="stats">
        <div class="stat">
          <span class="stat-num fans-count">--</span>
          <span class="stat-label">粉丝</span>
        </div>
        <div class="stat">
          <span class="stat-num likes-count">--</span>
          <span class="stat-label">获赞</span>
        </div>
      </div>
      <a class="btn" href="https://www.douyin.com/user/MS4wLjABAAAAYLVzofvsSh9Whf4VPeVXU6HB8oG1vW1hnCk7z1lJbyM" target="_blank" rel="noopener">打开抖音主页</a>
    </div>

    <div class="douyin-card card">
      <span class="card-emoji">🎵</span>
      <h2>远方的诗歌</h2>
      <p>用旅行治愈生活，在流浪的日子里寻找自我。</p>
      <div class="stats">
        <div class="stat">
          <span class="stat-num fans-count">--</span>
          <span class="stat-label">粉丝</span>
        </div>
        <div class="stat">
          <span class="stat-num likes-count">--</span>
          <span class="stat-label">获赞</span>
        </div>
      </div>
      <a class="btn" href="https://www.douyin.com/user/MS4wLjABAAAA73ORY7cD2_bw5dkwqXFxtQxbY7fuAdoYS1Palc8yX_Sh7zpJcKJ8wY904uqc0eoL" target="_blank" rel="noopener">打开抖音主页</a>
    </div>
  </div>
</section>

<!-- Footer -->
<footer id="footer">
  <p class="footer-copy">数据由 Puppeteer 自动爬取 · 每 2 小时更新</p>
</footer>
