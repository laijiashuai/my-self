<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>招聘信息提交</title>
    <link rel="stylesheet" href="css/recruitment.css">
</head>
<body>
    <div class="container">
        <h2>招聘信息提交</h2>
        <form id="recruitForm">
            <div class="form-group">
                <label>公司名</label>
                <div class="input-wrapper">
                    <input type="text" name="company_name" required>
                    <span class="required-star">*</span>
                </div>
            </div>
            <div class="form-group">
                <label>联系人</label>
                <div class="input-wrapper">
                    <input type="text" name="contact_person" required>
                    <span class="required-star">*</span>
                </div>
            </div>
            <div class="form-group">
                <label>电话</label>
                <div class="input-wrapper">
                    <input type="tel" name="phone" required placeholder="如：13800138000 / 400-918-0889">
                    <span class="required-star">*</span>
                </div>
            </div>
            <div class="form-group">
                <label>岗位</label>
                <div class="input-wrapper">
                    <input type="text" name="position" required>
                    <span class="required-star">*</span>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group half">
                    <label>最低薪资（元）</label>
                    <div class="input-wrapper">
                        <input type="number" name="min_salary" required min="0" step="100">
                        <span class="required-star">*</span>
                    </div>
                </div>
                <div class="form-group half">
                    <label>最高薪资（元）</label>
                    <div class="input-wrapper">
                        <input type="number" name="max_salary" required min="0" step="100">
                        <span class="required-star">*</span>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label>邮箱</label>
                <div class="input-wrapper">
                    <input type="text" name="email">
                </div>
            </div>
            <div class="form-group">
                <label>介绍</label>
                <textarea name="description" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>岗位职责</label>
                <textarea name="job_responsibilities" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>任职要求</label>
                <textarea name="job_requirements" rows="3"></textarea>
            </div>
            <button type="submit" class="submit-btn">提交</button>
        </form>
        <div id="message" class="message"></div>
    </div>
    <script src="js/recruitment.js"></script>
</body>
</html>
