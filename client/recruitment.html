<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>招聘信息</title>
    <link rel="stylesheet" href="css/recruitment.css">
</head>

<body>
    <nav class="top-nav">
        <a href="./index.html" class="btn-back-home" title="返回首页">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
        </a>
    </nav>
    <div class="container">
        <h2>招聘信息</h2>
        <form id="recruitForm">
            <div class="form-group">
                <label>公司名</label>
                <div class="input-wrapper">
                    <input type="text" name="company_name" required>
                    <span class="required-star">*</span>
                </div>
            </div>
            <div class="form-group">
                <label>联系人</label>
                <div class="input-wrapper">
                    <input type="text" name="contact_person" required>
                    <span class="required-star">*</span>
                </div>
            </div>
            <div class="form-group">
                <label>电话</label>
                <div class="input-wrapper">
                    <input type="tel" name="phone" required placeholder="如：13800138000 / 400-000-0000">
                    <span class="required-star">*</span>
                </div>
            </div>
            <div class="form-group">
                <label>岗位</label>
                <div class="input-wrapper">
                    <input type="text" name="position" required>
                    <span class="required-star">*</span>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group half">
                    <label>最低薪资（元）</label>
                    <div class="input-wrapper">
                        <input type="number" name="min_salary" required min="0" step="100">
                        <span class="required-star">*</span>
                    </div>
                </div>
                <div class="form-group half">
                    <label>最高薪资（元）</label>
                    <div class="input-wrapper">
                        <input type="number" name="max_salary" required min="0" step="100">
                        <span class="required-star">*</span>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label>邮箱</label>
                <div class="input-wrapper">
                    <input type="text" name="email">
                </div>
            </div>
            <div class="form-group">
                <label>岗位职责</label>
                <textarea name="job_responsibilities" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>任职要求</label>
                <textarea name="job_requirements" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>介绍</label>
                <textarea name="description" rows="3"></textarea>
            </div>
            <button type="submit" class="submit-btn">提交</button>
        </form>
        <div id="message" class="message"></div>
    </div>
    <script src="js/recruitment.js"></script>
</body>

</html>
